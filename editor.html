<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Do-file Editor — Stata Web</title>
<link rel="stylesheet" href="style.css?v=20261126081629">
<style>
  body { height: 100vh; }
  .center { margin: 8px; flex: 1; }
</style>
</head>
<body>
<section class="center">
  <div class="edtools">
    <span id="edName">untitled.do</span>
    <label class="btn">Mở .do<input type="file" id="doOpen" accept=".do,.txt" hidden></label>
    <button id="edNew">Mới</button>
    <button id="edSave">Lưu (Ctrl+S)</button>
    <button id="edRunAll" class="primary">▶ Chạy tất cả (Ctrl+D)</button>
    <button id="edRunSel">▶ Chạy phần chọn (Ctrl+Shift+D)</button>
    <span id="status" class="muted"></span>
  </div>
  <div class="dtabs" id="dtabs"></div>
  <div class="edwrap"><pre id="lineno"></pre><div class="edstack"><pre id="hl"></pre><textarea id="editor" spellcheck="false" placeholder="* Viết do-file ở đây"></textarea></div></div>
</section>
<script src="edit.js?v=20261126081629"></script>
<script>
const ch = new BroadcastChannel('stata-web');
const $ = (s) => document.querySelector(s);
const ed = $('#editor');
const sync = () => ch.postMessage({ type: 'sync', text: D.text(), name: D.name() });
const D = window.DoEditor({ textarea: ed, overlay: $('#hl'), lineno: $('#lineno'), tabbar: $('#dtabs'), nameEl: $('#edName'),
  onChange: () => { clearTimeout(window._t); window._t = setTimeout(sync, 400); } });
$('#dtabs').addEventListener('click', () => setTimeout(() => { document.title = D.name() + ' — Do-file Editor'; sync(); }, 0));
function runAll() { ch.postMessage({ type: 'run', code: D.text(), label: 'do ' + D.name() }); }
function runSel() {
  let s = ed.value.substring(ed.selectionStart, ed.selectionEnd);
  if (!s.trim()) { const v = ed.value, p = ed.selectionStart; const a = v.lastIndexOf('\n', p - 1) + 1, b = v.indexOf('\n', p); s = v.substring(a, b < 0 ? v.length : b); }
  ch.postMessage({ type: 'run', code: s, label: s.split('\n')[0].slice(0, 80) });
}
function save() { ch.postMessage({ type: 'save', text: D.text(), name: D.name() }); }
ed.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'd' || e.key === 'D')) { e.preventDefault(); e.shiftKey ? runSel() : runAll(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); }
});
$('#edRunAll').onclick = runAll;
$('#edRunSel').onclick = runSel;
$('#edSave').onclick = save;
$('#edNew').onclick = () => { D.open('untitled' + (D.docs.length + 1) + '.do', ''); sync(); };
$('#doOpen').onchange = async (e) => { const f = e.target.files[0]; if (!f) return; D.open(f.name, await f.text()); sync(); e.target.value = ''; };
ch.onmessage = (ev) => {
  const m = ev.data;
  if (m.type === 'load') { if (m.name !== D.name() || m.text !== D.text()) D.open(m.name, m.text); document.title = m.name + ' — Do-file Editor'; }
  else if (m.type === 'status') $('#status').textContent = m.text;
};
ch.postMessage({ type: 'hello' });
</script>
</body>
</html>
